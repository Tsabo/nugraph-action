name: 'NuGet dependency graph'
description: 'Generate a NuGet dependency graph for a .NET solution or project using nugraph'
inputs:
  project-path:
    description: 'Path to the .sln or .csproj file to analyze'
    required: true
  output-path:
    description: 'Where to write the generated graph artifact (svg/png/pdf/jpg/mmd/mermaid). Leave unset to skip writing an artifact file. When project-path is a .sln, each project gets its own file with the project name inserted before the extension (e.g. graph.svg -> graph.MyApp.svg).'
    required: false
    default: ''
  job-summary:
    description: "Append the graph as a Mermaid diagram to the GitHub Actions job summary. Defaults to 'true' when output-path is unset, otherwise 'false' -- set explicitly to override."
    required: false
    default: ''
  job-summary-title:
    description: 'Heading text shown above the Mermaid diagram in the job summary (only used when job-summary is true)'
    required: false
    default: 'Dependency graph'
  title:
    description: "Title embedded in the generated graph itself, passed to nugraph's -t/--title. Leave unset to use nugraph's default ('Dependency graph of [SOURCE]'). Set explicitly to '' (empty string) to omit the title entirely."
    required: false
    default: '::unset::'
  include-versions:
    description: 'Include package versions in the dependency graph nodes, e.g. Serilog@4.3.0 instead of Serilog'
    required: false
    default: 'false'
  direction:
    description: "The direction of the dependency graph, possible values are 'LeftToRight' (recommended for large graphs) and 'TopToBottom' (good for small graphs). Leave unset to use nugraph's default (LeftToRight)."
    required: false
    default: ''
  no-links:
    description: 'Remove clickable links from the dependency graph. Can be useful to reduce the size of the graph if it becomes too large and Mermaid Live Editor is returning "Maximum text size in diagram exceeded"'
    required: false
    default: 'false'
  ignore:
    description: 'Newline-separated list of package name patterns to ignore, each turned into a separate -i flag (e.g. "System.*")'
    required: false
    default: ''
  hide-empty-graphs:
    description: 'Skip projects whose dependency graph has no packages -- no artifact file is written and no job summary section is added for them. Most useful when project-path is a solution and some projects have no NuGet dependencies.'
    required: false
    default: 'false'
  extra-args:
    description: 'Additional CLI arguments passed to nugraph, space-separated (values containing spaces are not supported)'
    required: false
    default: ''
  install-tool:
    description: 'Install nugraph as a .NET global tool'
    required: false
    default: 'true'
  dotnet-version:
    description: '.NET SDK version to use'
    required: false
    default: '8.0.x'
runs:
  using: 'composite'
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Add dotnet tools to PATH
      shell: bash
      run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Install nugraph
      if: ${{ inputs.install-tool == 'true' }}
      shell: bash
      run: |
        if ! command -v nugraph >/dev/null 2>&1; then
          dotnet tool install --global nugraph
        fi

    - name: Generate dependency graph
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.project-path }}
        OUTPUT_PATH: ${{ inputs.output-path }}
        JOB_SUMMARY: ${{ inputs.job-summary }}
        JOB_SUMMARY_TITLE: ${{ inputs.job-summary-title }}
        TITLE: ${{ inputs.title }}
        INCLUDE_VERSIONS: ${{ inputs.include-versions }}
        DIRECTION: ${{ inputs.direction }}
        NO_LINKS: ${{ inputs.no-links }}
        IGNORE_PATTERNS: ${{ inputs.ignore }}
        HIDE_EMPTY_GRAPHS: ${{ inputs.hide-empty-graphs }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: bash "$GITHUB_ACTION_PATH/scripts/generate-graph.sh"
