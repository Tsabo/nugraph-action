name: 'NuGet dependency graph'
description: 'Generate a NuGet dependency graph for a .NET solution or project using nugraph'
inputs:
  project-path:
    description: 'Path to the .sln or .csproj file to analyze'
    required: true
  output-path:
    description: 'Where to write the generated graph artifact (svg/png/pdf/jpg/mmd/mermaid). Leave unset to skip writing an artifact file.'
    required: false
    default: ''
  job-summary:
    description: "Append the graph as a Mermaid diagram to the GitHub Actions job summary. Defaults to 'true' when output-path is unset, otherwise 'false' -- set explicitly to override."
    required: false
    default: ''
  job-summary-title:
    description: 'Heading text shown above the Mermaid diagram in the job summary (only used when job-summary is true)'
    required: false
    default: 'Dependency graph'
  ignore:
    description: 'Newline-separated list of package name patterns to ignore, each turned into a separate -i flag (e.g. "System.*")'
    required: false
    default: ''
  extra-args:
    description: 'Additional CLI arguments passed to nugraph, space-separated (values containing spaces are not supported)'
    required: false
    default: ''
  install-tool:
    description: 'Install nugraph as a .NET global tool'
    required: false
    default: 'true'
  dotnet-version:
    description: '.NET SDK version to use'
    required: false
    default: '8.0.x'
runs:
  using: 'composite'
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Add dotnet tools to PATH
      shell: bash
      run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Install nugraph
      if: ${{ inputs.install-tool == 'true' }}
      shell: bash
      run: |
        if ! command -v nugraph >/dev/null 2>&1; then
          dotnet tool install --global nugraph
        fi

    - name: Generate dependency graph
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.project-path }}
        OUTPUT_PATH: ${{ inputs.output-path }}
        JOB_SUMMARY: ${{ inputs.job-summary }}
        JOB_SUMMARY_TITLE: ${{ inputs.job-summary-title }}
        IGNORE_PATTERNS: ${{ inputs.ignore }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        if [[ -z "$JOB_SUMMARY" ]]; then
          # Auto: default to a job summary when there's no artifact to
          # otherwise show the graph came from.
          [[ -z "$OUTPUT_PATH" ]] && JOB_SUMMARY="true" || JOB_SUMMARY="false"
        fi

        if [[ -z "$OUTPUT_PATH" && "$JOB_SUMMARY" != "true" ]]; then
          echo "::error::Set at least one of 'output-path' or 'job-summary' -- otherwise this action has nothing to do." >&2
          exit 1
        fi

        ignore_flags=()
        while IFS= read -r pattern; do
          [[ -n "$pattern" ]] && ignore_flags+=(-i "$pattern")
        done <<< "$IGNORE_PATTERNS"

        # nugraph's --output always writes raw graph source (Mermaid text for
        # .mmd/.mermaid, Graphviz DOT text otherwise) -- it never renders an
        # image itself when --output is given. For image extensions, render
        # the Graphviz DOT source locally with Graphviz's `dot` instead.

        if [[ "$JOB_SUMMARY" == "true" ]]; then
          mermaid_source="$(mktemp --suffix=.mmd)"
          nugraph "$PROJECT_PATH" "${ignore_flags[@]}" $EXTRA_ARGS --output "$mermaid_source"
          {
            echo "### ${JOB_SUMMARY_TITLE}"
            echo '```mermaid'
            cat "$mermaid_source"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$mermaid_source"
        fi

        if [[ -n "$OUTPUT_PATH" ]]; then
          mkdir -p "$(dirname "$OUTPUT_PATH")"
          case "${OUTPUT_PATH,,}" in
            *.svg|*.png|*.pdf|*.jpg|*.jpeg)
              if ! command -v dot >/dev/null 2>&1; then
                sudo apt-get update -qq
                sudo apt-get install -y --no-install-recommends graphviz
              fi
              graph_source="$(mktemp --suffix=.gv)"
              nugraph "$PROJECT_PATH" "${ignore_flags[@]}" $EXTRA_ARGS --output "$graph_source"
              render_format="${OUTPUT_PATH##*.}"
              render_format="${render_format,,}"
              [[ "$render_format" == "jpeg" ]] && render_format="jpg"
              dot "-T$render_format" "$graph_source" -o "$OUTPUT_PATH"
              rm -f "$graph_source"
              ;;
            *)
              nugraph "$PROJECT_PATH" "${ignore_flags[@]}" $EXTRA_ARGS --output "$OUTPUT_PATH"
              ;;
          esac
        fi
