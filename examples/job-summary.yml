name: NuGet dependency graph (job summary)

# Shows the dependency graph directly on the pull request's checks page as a
# native Mermaid diagram -- no artifact download needed. GitHub renders
# ```mermaid fenced code blocks in job summaries, and the action writes one
# there itself when job-summary is enabled. output-path is left unset since
# no artifact file is needed here -- job-summary would actually default to
# 'true' in that case anyway, but it's set explicitly below for clarity.

on:
  pull_request:

jobs:
  generate-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate graph
        uses: Tsabo/nugraph-action@main
        with:
          project-path: ./src/MyApp.sln
          job-summary: 'true'
