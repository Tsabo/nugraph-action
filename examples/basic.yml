name: NuGet dependency graph

on:
  workflow_dispatch:
    inputs:
      project-path:
        description: Path to the .sln or .csproj file to analyze
        required: true
        default: ./src/MyApp.sln
        type: string
      output-path:
        description: Where to write the generated graph artifact
        required: false
        default: artifacts/nugraph/graph.svg
        type: string
      ignore:
        description: Newline-separated package name patterns to ignore (e.g. System.*)
        required: false
        default: ''
        type: string
      extra-args:
        description: Additional CLI arguments passed to nugraph
        required: false
        default: ''
        type: string

jobs:
  generate-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate graph
        uses: Tsabo/nugraph-action@master
        with:
          project-path: ${{ inputs.project-path }}
          output-path: ${{ inputs.output-path }}
          ignore: ${{ inputs.ignore }}
          extra-args: ${{ inputs.extra-args }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-dependency-graph
          # project-path may be a .sln, in which case the action writes one
          # file per project with the project name inserted before the
          # extension (e.g. graph.svg -> graph.MyApp.svg), so upload the
          # whole output directory rather than the exact output-path.
          path: artifacts/nugraph/
          if-no-files-found: error
