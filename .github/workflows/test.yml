name: Test action

# Exercises the composite action against the fixture project in test/Fixture,
# so every push/PR proves the action still works end to end. The SVG is
# uploaded as an artifact for download (exercising the Graphviz-rendering
# path). The job summary embeds the same graph as a native Mermaid diagram
# instead of an image -- GitHub renders ```mermaid fenced blocks directly,
# and nugraph can emit that syntax as plain text with no rendering step.

on:
  push:
  pull_request:

jobs:
  generate-fixture-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SVG graph from fixture project
        uses: ./
        with:
          project-path: test/Fixture/Fixture.csproj
          output-path: artifacts/nugraph/graph.svg
          dotnet-version: '10.0.x'

      - name: Generate Mermaid graph for job summary
        uses: ./
        with:
          project-path: test/Fixture/Fixture.csproj
          output-path: artifacts/nugraph/graph.mmd
          dotnet-version: '10.0.x'

      - name: Add graph to job summary
        run: |
          {
            echo '### Fixture dependency graph'
            echo '```mermaid'
            cat artifacts/nugraph/graph.mmd
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload graph artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixture-dependency-graph
          path: artifacts/nugraph/graph.svg
          if-no-files-found: error
