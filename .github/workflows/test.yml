name: Test action

# Exercises the composite action against the fixture project in test/Fixture,
# so every push/PR proves the action still works end to end. The SVG is
# uploaded as an artifact for download (exercising the Graphviz-rendering
# path), and job-summary exercises the action's built-in Mermaid job summary
# in the same run -- GitHub renders ```mermaid fenced blocks directly, and
# nugraph can emit that syntax as plain text with no rendering step.
#
# A second job repeats this against test/Fixture.sln, a solution referencing
# test/Fixture, test/FixtureTwo and test/FixtureEmpty, to exercise the
# action's solution expansion (one nugraph run per project, per-project
# output filenames and job summary sections) since nugraph itself has no
# concept of .sln files.
#
# A third job repeats the solution run with hide-empty-graphs enabled, to
# verify that test/FixtureEmpty (which has no PackageReference at all, so
# its graph is always empty) is skipped -- no output file and no job summary
# section -- while Fixture and FixtureTwo are unaffected.
#
# A fourth job exercises the graph-styling inputs (title, include-versions,
# direction, no-links) against test/Fixture, and separately exercises the
# title: '' vs. unset distinction (see README's "Customizing the graph"),
# by inspecting the raw Mermaid text each run appends to the job summary.

on:
  push:
  pull_request:

jobs:
  generate-fixture-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate dependency graph
        uses: ./
        with:
          project-path: test/Fixture/Fixture.csproj
          output-path: artifacts/nugraph/graph.svg
          job-summary: 'true'
          job-summary-title: 'Fixture dependency graph'
          dotnet-version: '10.0.x'

      - name: Upload graph artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixture-dependency-graph
          path: artifacts/nugraph/graph.svg
          if-no-files-found: error

  generate-fixture-solution-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate dependency graph
        uses: ./
        with:
          project-path: test/Fixture.sln
          output-path: artifacts/nugraph/graph.svg
          job-summary: 'true'
          job-summary-title: 'Solution dependency graph'
          dotnet-version: '10.0.x'

      - name: Verify per-project output files were created
        shell: bash
        run: |
          test -f artifacts/nugraph/graph.Fixture.svg
          test -f artifacts/nugraph/graph.FixtureTwo.svg

      - name: Upload graph artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fixture-solution-dependency-graphs
          path: artifacts/nugraph/*.svg
          if-no-files-found: error

  generate-fixture-solution-graph-hide-empty:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate dependency graph
        uses: ./
        with:
          project-path: test/Fixture.sln
          output-path: artifacts/nugraph/graph.svg
          job-summary: 'true'
          job-summary-title: 'Solution dependency graph (empty graphs hidden)'
          hide-empty-graphs: 'true'
          dotnet-version: '10.0.x'

      - name: Verify empty project's graph was skipped, others were not
        shell: bash
        run: |
          test -f artifacts/nugraph/graph.Fixture.svg
          test -f artifacts/nugraph/graph.FixtureTwo.svg
          test ! -f artifacts/nugraph/graph.FixtureEmpty.svg

      - name: Upload graph artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fixture-solution-dependency-graphs-hide-empty
          path: artifacts/nugraph/*.svg
          if-no-files-found: error

  generate-fixture-custom-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Verified against the raw .mmd output files rather than the job
      # summary -- GITHUB_STEP_SUMMARY is scoped per step (each step gets
      # its own fresh file that the runner only stitches together for
      # display), so a later step can't read what an earlier step wrote to
      # it.
      - name: Generate dependency graph (custom styling)
        uses: ./
        with:
          project-path: test/Fixture/Fixture.csproj
          output-path: artifacts/nugraph/custom.mmd
          title: 'Custom styling test title'
          include-versions: 'true'
          direction: 'TopToBottom'
          no-links: 'true'
          dotnet-version: '10.0.x'

      - name: Generate dependency graph (blank title)
        uses: ./
        with:
          project-path: test/Fixture/Fixture.csproj
          output-path: artifacts/nugraph/blank-title.mmd
          title: ''
          dotnet-version: '10.0.x'

      - name: Verify custom styling was applied
        shell: bash
        run: |
          grep -q '^title: Custom styling test title$' artifacts/nugraph/custom.mmd
          grep -q '^graph TB$' artifacts/nugraph/custom.mmd
          grep -Eq 'Serilog/[0-9]+\.[0-9]+\.[0-9]+' artifacts/nugraph/custom.mmd
          ! grep -q '^click ' artifacts/nugraph/custom.mmd

      - name: Verify blank title omits the title block
        shell: bash
        run: |
          ! grep -q '^title:' artifacts/nugraph/blank-title.mmd
          grep -q '^graph LR$' artifacts/nugraph/blank-title.mmd
